name: UpFashion Play Store smoke test

# Credentials are used only on explicit maintainer dispatch, never on PR events.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upfashion-play-smoke
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed workflow code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check required secrets
        env:
          GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
          GOOGLE_AAS_TOKEN: ${{ secrets.GOOGLE_AAS_TOKEN }}
        run: python3 scripts/play_download.py --check-secrets
      - name: Install pinned apkeep and prepare x86_64 Play profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upfashion-tools"
          curl --fail --location --retry 3 \
            https://github.com/EFForg/apkeep/releases/download/1.1.0/apkeep-x86_64-unknown-linux-gnu \
            -o "$RUNNER_TEMP/upfashion-tools/apkeep"
          echo "badd7ad9fa7d2f32abe01eaf33b7ff086361a95bbc000a33bf44b630d4bf2140  $RUNNER_TEMP/upfashion-tools/apkeep" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/upfashion-tools/apkeep"
          echo "$RUNNER_TEMP/upfashion-tools" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/EFForg/rs-google-play/eb423a3edfc653a1d533d4b7f6c9148d5bc144a8/gpapi/device.properties \
            -o "$RUNNER_TEMP/upfashion-tools/device.properties"
          echo "95d89bc82f6e2cdb7884b3571b9116dd4ed2a60e8fca2953c5078b0b37a06fed  $RUNNER_TEMP/upfashion-tools/device.properties" | sha256sum --check
          python3 scripts/play_download.py --prepare-profile "$RUNNER_TEMP/upfashion-tools/device.properties"
          "$RUNNER_TEMP/upfashion-tools/apkeep" --version
      - name: Download from Google Play
        env:
          GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
          GOOGLE_AAS_TOKEN: ${{ secrets.GOOGLE_AAS_TOKEN }}
        run: python3 scripts/play_download.py --download "$RUNNER_TEMP/upfashion-apks" --profile "$RUNNER_TEMP/upfashion-tools/device.properties"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install compatible APKs and launch
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          pre-emulator-launch-script: sdkmanager 'build-tools;34.0.0'
          script: python3 scripts/android_smoke.py "$RUNNER_TEMP/upfashion-apks"
      - name: Remove downloaded app and temporary credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/upfashion-apks" "$RUNNER_TEMP/upfashion-tools"
